<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yankı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06060c">
<meta name="description" content="Yankı — altını topla, geçmişine dokunma. Her hareketin bir sonraki turda sana geri döner.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed canvas arena; thin HUD strip on top; DOM screens float over the canvas. One dark neon world on purpose. */
:root{
  --bg:#06060c;        /* the void */
  --ink:#eef0ff;       /* text */
  --dim:#8a8fb3;       /* secondary text, hue-biased toward the cyan */
  --you:#7ef9ff;       /* the present you */
  --past:#ff3d6e;      /* your echoes */
  --gold:#ffd166;      /* the thing you want */
  --void:#b47cff;      /* the orb that eats the past */
  --panel:rgba(10,10,22,.82);
  --f-logo:'Monoton','Sora',system-ui,sans-serif;
  --f-ui:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--f-ui);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#cv{position:fixed;inset:0;display:block;cursor:crosshair}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hud-l{display:flex;flex-direction:column;gap:2px}
.hud-c{display:flex;flex-direction:column;align-items:center;gap:0}
.hud-r{display:flex;justify-content:flex-end;padding-right:44px}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
#hScore{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
#hRound{font-family:var(--f-num);font-size:30px;line-height:1;color:var(--past);font-variant-numeric:tabular-nums}
#hCombo{font-family:var(--f-num);font-size:18px;color:var(--gold);opacity:0;transition:opacity .2s, transform .2s}
#hCombo.on{opacity:1}
#hCombo.pop{transform:scale(1.35)}
#pauseBtn{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(138,143,179,.35);background:transparent;color:var(--dim);font:700 12px var(--f-num);cursor:pointer}

#toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;
  font-weight:600;font-size:clamp(16px,4.4vw,24px);max-width:min(90vw,560px);text-wrap:balance;opacity:0;text-shadow:0 0 18px rgba(0,0,0,.9)}
#toast.show{animation:toast var(--d,2.6s) ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}10%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}

/* Screens */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.logo{font-family:var(--f-logo);font-weight:400;font-size:clamp(64px,19vw,168px);line-height:1;margin:0;color:var(--you);letter-spacing:.02em;
  text-shadow:.07em .05em 0 rgba(255,61,110,.55),.14em .10em 0 rgba(255,61,110,.32),.21em .15em 0 rgba(255,61,110,.16),.28em .20em 0 rgba(255,61,110,.07);
  animation:echo 3.2s ease-in-out infinite}
@keyframes echo{50%{text-shadow:.04em .03em 0 rgba(255,61,110,.55),.08em .06em 0 rgba(255,61,110,.32),.12em .09em 0 rgba(255,61,110,.16),.16em .12em 0 rgba(255,61,110,.07)}}
.tag{margin:0;font-size:clamp(15px,3.8vw,19px);color:var(--ink);text-wrap:balance}
.tag em{font-style:normal;color:var(--gold)}
.tag i{font-style:normal;color:var(--past)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.big{font-weight:800;font-size:18px;letter-spacing:.24em;padding:16px 46px 16px 52px;border-radius:999px;border:2px solid var(--you);
  color:var(--bg);background:var(--you);cursor:pointer;box-shadow:0 0 28px rgba(126,249,255,.35);transition:transform .12s, box-shadow .2s}
.big:hover{transform:scale(1.04);box-shadow:0 0 44px rgba(126,249,255,.55)}
.big:active{transform:scale(.97)}
.alt{font-weight:600;font-size:14px;letter-spacing:.06em;padding:11px 22px;border-radius:999px;border:1px solid rgba(255,209,102,.55);
  color:var(--gold);background:transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.alt small{font-family:var(--f-num);color:var(--dim);font-size:12px}
.chip{font-size:13px;padding:9px 16px;border-radius:999px;border:1px solid rgba(138,143,179,.35);background:rgba(10,10,22,.5);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.meta{font-size:13px;color:var(--dim);letter-spacing:.06em}
.meta b{font-family:var(--f-num);color:var(--ink);font-weight:700;margin-left:6px}
.hint{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:6px 0 0}

#menu{background:radial-gradient(ellipse at 50% 45%,rgba(6,6,12,.15),rgba(6,6,12,.75) 70%)}

#over{justify-content:flex-end;background:linear-gradient(to bottom,rgba(6,6,12,0) 30%,rgba(6,6,12,.88) 62%,var(--bg))}
.killer{margin:0;font-size:clamp(15px,4vw,20px);color:var(--past);text-wrap:balance;max-width:34ch}
.allyou{margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.bigstat{display:flex;align-items:baseline;gap:10px}
.bigstat b{font-family:var(--f-num);font-size:clamp(56px,16vw,96px);line-height:1;color:var(--ink)}
.bigstat span{font-size:16px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 22px;justify-content:center}
.stats div{display:flex;flex-direction:column;gap:2px;align-items:center}
.stats b{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#oNew{margin:0;font:700 13px var(--f-num);letter-spacing:.3em;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,auto)}}

#pause{background:rgba(6,6,12,.78)}
#pause h2{margin:0;font:700 16px var(--f-num);letter-spacing:.4em;color:var(--dim)}

#art{background:rgba(6,6,12,.94);gap:12px}
#artImg{max-width:min(92vw,440px);max-height:68vh;border-radius:6px;box-shadow:0 0 0 1px rgba(138,143,179,.25),0 20px 60px rgba(0,0,0,.6);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
#art p{margin:0;font-size:12px;color:var(--dim)}
#copyBox{font:12px var(--f-num);color:var(--ink);background:rgba(10,10,22,.9);border:1px solid rgba(138,143,179,.35);border-radius:8px;padding:10px 12px;max-width:90vw;user-select:text;-webkit-user-select:text}

.alt2{font-weight:700;font-size:15px;letter-spacing:.18em;padding:13px 32px;border-radius:999px;border:1px solid rgba(126,249,255,.6);color:var(--you);background:rgba(10,10,22,.5);cursor:pointer;display:inline-flex;gap:10px;align-items:baseline}
.alt2 small{font-family:var(--f-num);color:var(--gold);font-size:12px;letter-spacing:.04em}
#profBtn{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--dim);font:600 13px var(--f-ui);letter-spacing:.06em;cursor:pointer;padding:6px 10px}
#profBtn b{color:var(--ink);font-family:var(--f-num)}
#profBtn em{font-style:normal;color:var(--you);font-size:12px}
.bar{width:90px;height:6px;border-radius:3px;background:rgba(138,143,179,.25);overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--you);width:0}

/* level map */
#levels{justify-content:flex-start;gap:10px;background:rgba(6,6,12,.86)}
#profile{background:rgba(6,6,12,.86)}
.lv-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:min(100%,460px);gap:8px}
.lv-head h2{margin:0;font:800 20px var(--f-ui);letter-spacing:.04em}
.lv-head p{margin:2px 0 4px;font-size:13px;color:var(--dim);text-wrap:balance}
.lv-head .ws{font:700 13px var(--f-num);color:var(--gold)}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(138,143,179,.35);background:transparent;color:var(--ink);font:700 18px var(--f-num);cursor:pointer}
.arrow:disabled{opacity:.2;cursor:default}
#lvMap{position:relative;flex:1;width:min(100%,400px);min-height:0;margin:10px 0 14px}
#lvMap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:2px solid var(--you);background:rgba(6,6,12,.9);color:var(--ink);font:700 17px var(--f-num);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(126,249,255,.22);padding:0}
.node .st{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;font-size:11px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.node .st i{font-style:normal;color:rgba(138,143,179,.4)}
.node.done{background:rgba(20,50,60,.95)}
.node.lock{border-color:rgba(138,143,179,.25);color:var(--dim);box-shadow:none;cursor:default;font-size:13px}
.node.boss{width:66px;height:66px;border-color:var(--past);box-shadow:0 0 24px rgba(255,61,110,.35)}
.node.boss.lock{border-color:rgba(138,143,179,.25);box-shadow:none}
.node.cur{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 32px rgba(126,249,255,.75)}}
.wlock{position:absolute;inset:-6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(6,6,12,.78);border-radius:16px;font-size:15px;color:var(--ink);text-wrap:balance;padding:0 24px}
.wlock b{font-size:30px}

/* level intro */
#lvl{background:rgba(6,6,12,.9)}
#lvl h2{margin:0;font:700 13px var(--f-num);letter-spacing:.3em;color:var(--dim)}
#lvl h3{margin:0;font:800 30px var(--f-ui)}
#lvl .goal{margin:6px 0 0;font-size:19px}
#lvl .goal b{color:var(--gold);font-family:var(--f-num)}
.stars-row{display:flex;gap:20px;justify-content:center;font-size:13px;color:var(--dim)}
.stars-row b{display:block;color:rgba(138,143,179,.45);font-size:17px;letter-spacing:2px}
.stars-row .got b{color:var(--gold)}
.twist{max-width:34ch;color:var(--ink);font-size:15px;text-wrap:balance;margin:0}

/* results */
#over{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:12px}
#over>:first-child{margin-top:auto}
#oTitle{margin:0;font:800 15px var(--f-num);letter-spacing:.3em;color:var(--gold)}
#oStars{font-size:46px;letter-spacing:8px;color:var(--gold);margin:0;line-height:1;text-shadow:0 0 24px rgba(255,209,102,.5)}
#oStars i{font-style:normal;color:rgba(138,143,179,.28);text-shadow:none}
#oXp{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:13px;color:var(--dim)}
#oXp .bar{width:120px;margin-left:6px}
#oXp .up{color:var(--you);font-weight:700;letter-spacing:.08em}
#oXp .ms{color:var(--gold)}

/* profile */
#profile{justify-content:flex-start;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{font:600 13px var(--f-ui);padding:8px 14px;border-radius:999px;border:1px solid rgba(138,143,179,.35);background:transparent;color:var(--dim);cursor:pointer}
.tab.on{color:var(--bg);background:var(--you);border-color:var(--you)}
#pBody{flex:1;min-height:0;overflow-y:auto;width:min(100%,460px);touch-action:pan-y;-webkit-overflow-scrolling:touch;text-align:left}
.ms-card{border:1px solid rgba(138,143,179,.25);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:rgba(10,10,22,.6)}
.ms-card p{margin:0 0 9px;font-size:15px}
.ms-card .bar{width:100%;height:7px}
.ms-card small{display:flex;justify-content:space-between;margin-top:7px;color:var(--dim);font:12px var(--f-num)}
.ms-card small b{color:var(--gold);font-weight:700}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;cursor:pointer;box-shadow:0 0 0 1px rgba(138,143,179,.2);display:block}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-grid div{border:1px solid rgba(138,143,179,.2);border-radius:10px;padding:10px 12px}
.st-grid b{display:block;font:700 22px var(--f-num)}
.st-grid span{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.insight{margin:16px 0 0;color:var(--past);font-size:16px;text-wrap:balance}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.look{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid rgba(138,143,179,.25);background:transparent;color:var(--ink);font:12px var(--f-ui);cursor:pointer}
.look.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.look.lock{opacity:.38;cursor:default}
.look i{width:30px;height:30px;border-radius:50%;display:block}
.look small{color:var(--dim);font-family:var(--f-num);font-size:11px}
.sec{margin:18px 0 8px;font:700 12px var(--f-num);letter-spacing:.24em;color:var(--dim)}
.sec:first-child{margin-top:0}
.empty{color:var(--dim);font-size:15px;margin-top:30px;text-align:center;text-wrap:balance}
#nameIn{font:15px var(--f-ui);padding:11px 14px;border-radius:10px;border:1px solid rgba(138,143,179,.35);background:rgba(10,10,22,.8);color:var(--ink);width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}

/* challenge */
#chal{background:rgba(6,6,12,.9)}
#chal h2{margin:0;font:700 13px var(--f-num);letter-spacing:.3em;color:var(--dim)}
#chal .who{margin:0;font:800 clamp(22px,6vw,30px) var(--f-ui);text-wrap:balance;max-width:20ch}
#chal .who b{color:#ff7a45}

@media (prefers-reduced-motion:reduce){.logo,#oNew,.node.cur{animation:none}#toast.show{animation-duration:.01s;opacity:1}}
</style>

<div id="safe"></div>
<canvas id="cv" aria-label="Yankı oyun alanı"></canvas>

<div id="hud" hidden>
  <div class="hud-l"><span class="lbl" data-i="score">skor</span><b id="hScore">0</b></div>
  <div class="hud-c"><b id="hRound">0</b><span class="lbl" id="hLbl">yankı</span></div>
  <div class="hud-r"><b id="hCombo">×1</b></div>
</div>
<button id="pauseBtn" hidden aria-label="Pause">II</button>
<div id="toast"></div>

<section id="menu" class="screen">
  <h1 class="logo">YANKI</h1>
  <p class="tag" id="mTag"></p>
  <button id="playBtn" class="big" data-i="play">OYNA</button>
  <button id="levelsBtn" class="alt2"><span data-i="levels">BÖLÜMLER</span><small id="mStars"></small></button>
  <button id="dailyBtn" class="alt"><span data-i="daily">Günün Yankısı</span><small id="dailyBest"></small></button>
  <div class="meta"><span data-i="best">En iyi</span><b id="mBest">0</b></div>
  <button id="profBtn"><span data-i="lvlWord">Seviye</span><b id="mLvl">1</b><span class="bar"><i id="mBar"></i></span><em data-i="profile"></em></button>
  <div class="row">
    <button id="sndBtn" class="chip"></button>
    <button id="langBtn" class="chip"></button>
  </div>
  <p class="hint" data-i="controls"></p>
</section>

<section id="over" class="screen" hidden>
  <p id="oTitle" hidden></p>
  <p id="oStars" hidden></p>
  <p class="allyou" id="oAllYou" data-i="allYou"></p>
  <p class="killer" id="oKiller"></p>
  <div class="bigstat"><b id="oRound">0</b><span id="oUnit">yankı</span></div>
  <p id="oNew" hidden></p>
  <div class="stats">
    <div><b id="oScore">0</b><span data-i="score"></span></div>
    <div><b id="oBest">0</b><span data-i="best"></span></div>
    <div><b id="oNear">0</b><span data-i="nearS"></span></div>
    <div><b id="oEaten">0</b><span data-i="eatenS"></span></div>
  </div>
  <div id="oXp"></div>
  <button id="nextBtn" class="big" data-i="next" hidden>SONRAKİ</button>
  <button id="againBtn" class="big" data-i="again">TEKRAR</button>
  <div class="row">
    <button id="chalBtn" class="chip" data-i="challenge" hidden></button>
    <button id="artBtn" class="chip" data-i="story"></button>
    <button id="copyBtn" class="chip" data-i="copy"></button>
    <button id="mapBtn" class="chip" data-i="map" hidden></button>
    <button id="menuBtn" class="chip" data-i="menu"></button>
  </div>
</section>

<section id="levels" class="screen" hidden>
  <div class="lv-head">
    <button id="wPrev" class="arrow" aria-label="previous world">‹</button>
    <div><h2 id="wName"></h2><p id="wTwist"></p><span class="ws" id="wStars"></span></div>
    <button id="wNext" class="arrow" aria-label="next world">›</button>
  </div>
  <div id="lvMap"></div>
  <button id="lvBack" class="chip" data-i="menu"></button>
</section>

<section id="lvl" class="screen" hidden>
  <h2 id="lTag"></h2>
  <h3 id="lName"></h3>
  <p class="twist" id="lTwist"></p>
  <p class="goal" id="lGoal"></p>
  <div class="stars-row" id="lStars"></div>
  <button id="lPlay" class="big" data-i="play"></button>
  <button id="lBack" class="chip" data-i="back"></button>
</section>

<section id="profile" class="screen" hidden>
  <div class="tabs" id="pTabs"></div>
  <div id="pBody"></div>
  <button id="pBack" class="chip" data-i="menu"></button>
</section>

<section id="chal" class="screen" hidden>
  <h2 data-i="chalTag"></h2>
  <p class="who" id="cWho"></p>
  <p class="twist" id="cText"></p>
  <button id="cPlay" class="big" data-i="accept"></button>
  <button id="cBack" class="chip" data-i="menu"></button>
</section>

<section id="art" class="screen" hidden>
  <img id="artImg" alt="">
  <p data-i="saveHint"></p>
  <div id="copyBox" hidden></div>
  <div class="row">
    <button id="dlBtn" class="chip" data-i="download"></button>
    <button id="artClose" class="chip" data-i="close"></button>
  </div>
</section>

<section id="pause" class="screen" hidden>
  <h2 data-i="paused"></h2>
  <button id="resumeBtn" class="big" data-i="resume"></button>
  <button id="quitBtn" class="chip" data-i="menu"></button>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------- tuning ---------- */
const DT = 1 / 60;
const R = 0.024;            // body radius (arena units; 1 unit = short side of arena)
const SPEED = 0.62;         // units / second
const GEM_R = 0.03, ORB_R = 0.03;
const GRACE = 30;           // steps at round start when echoes are harmless
const HIT = R * 2 * 0.78;   // forgiving hitbox
const NEAR = R * 2 + 0.05;  // near-miss zone

/* ---------- simulation ---------- */
function step() {

function collect() {

function eatGhost(g, x, y) {

function die(killer) {

function win() {

function killerText(k) {

  if (k.pre) return L().killedOther;
  if (k.mem) return L().killedMem;
  if (k.ch) return L().killedChal(G.chal.name, k.born);

function gameOver(won) {
  G.mode = 'over'; G.overT = 0; storyCache = null;
  const n = G.round - 1, c = G.cfg, k = G.killer; prefs.games++;
  ST.gems += n; ST.near += G.near; ST.eaten += G.eaten; ST.combo = Math.max(ST.combo, G.maxCombo);
  if (!won) { if (!k) ST.timeouts++; else if (!k.pre && !k.mem && !k.ch) ST.kill[k.born] = (ST.kill[k.born] || 0) + 1; }
  let isBest = false, newStars = 0, rec = null;
  if (!c) {
    isBest = n > prefs.best; if (isBest) prefs.best = n;
    prefs.bestScore = Math.max(prefs.bestScore || 0, G.score);
  }
  if (G.daily) { const d = todayStr(); if (prefs.dailyDate !== d) { prefs.dailyDate = d; prefs.dailyBest = 0; } prefs.dailyBest = Math.max(prefs.dailyBest || 0, n); bumpStreak(); }
  if (c) {
    rec = Object.assign({ s: 0, b: 0 }, prefs.lv[c.id]);
    if (won) {
      G.stars = 1 + (G.score >= c.s2 ? 1 : 0) + (G.score >= c.s3 ? 1 : 0);
      if (!rec.s) ST.cleared++;

      if (!c.boss) remember(c);

  const done = advanceMissions({
    near1: G.near, round1: c ? 0 : n, combo1: G.maxCombo, eatT: G.eaten, gemsT: n, daily: G.daily ? 1 : 0,
    starsT: newStars, gamesT: 1, nearT: G.near

  const xp = n + G.near + 2 * G.eaten + (won ? 15 : 0) + newStars * 10 + done.reduce((s, m) => s + m.xp, 0);
  prefs.xp += xp;
  const after = level();
  G.next = won && c ? nextLevel(c) : null;
  save();
  if (n >= 3 || won) saveToGallery();

  $('hud').hidden = true;
  const chalRes = G.chal ? (n > G.chal.n ? L().chalWin(G.chal.name, G.chal.n, n) : L().chalLose(G.chal.name, G.chal.n, n)) : '';
  $('oTitle').hidden = !(won || chalRes); $('oTitle').textContent = won ? L().cleared : chalRes;
  $('oTitle').style.color = G.chal && n <= G.chal.n ? 'var(--dim)' : '';

  $('oRound').textContent = c ? `${n}/${c.goal}` : n; $('oUnit').textContent = c ? L().gold : L().echoes;

    const got = SKINS.concat(PALS).filter(s => s.at > before.l && s.at <= after.l).map(s => s[lang]);
    if (got.length) h += `<span class="up">${L().unlocked(got.join(', '))}</span>`;
  }
  done.forEach(m => { h += `<span class="ms">✓ ${L().ms[m.t](m.n)} · +${m.xp} XP</span>`; });
  $('oXp').innerHTML = h;
  $('nextBtn').hidden = !G.next;

  $('chalBtn').hidden = !!(c || G.daily) || n < 3;

}

function pause() { if (G.mode !== 'play') return; G.mode = 'paused'; showScreen('pause'); Snd.droneOff(); }
function resume() { if (G.mode !== 'paused') return; G.mode = 'play'; showScreen(null); Snd.init(); Snd.droneOn(); Snd.droneSet(G.ghosts.length); last = performance.now(); acc = 0; }

/* ---------- fx ---------- */
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (0.2 + Math.random()) * sp; fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.4 + Math.random() * 0.6, col, size: 1 + Math.random() * 2.5 }); }
  if (fx.length > 700) fx.splice(0, fx.length - 700);
}
function puffAt(x, y, col, n) { burst(x, y, col, n, 0.18); Snd.puff(); }
function addText(x, y, s, col, size) { texts.push({ x, y, s, col, size, life: 0, max: 1.1 }); }
function updateFx(dt) {
  for (const p of fx) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
  fx = fx.filter(p => p.life < p.max);
  for (const t of texts) { t.life += dt; t.y -= dt * 0.05; }
  texts = texts.filter(t => t.life < t.max);
  G.shake = Math.max(0, (G.shake || 0) - dt * 40); G.flash = Math.max(0, (G.flash || 0) - dt * 1.6);
}

/* ---------- drawing ---------- */
function draw(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0); else { ctx.fillStyle = '#06060c'; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.mode === 'menu') { drawMenuDemo(dt); return; }
  if (G.mode === 'over') { drawOver(dt); drawFx(); return; }
  const sh = G.shake > 0 ? G.shake : 0;
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  drawBox();

  if (G.fright > 0) {
    const a = 0.08 + 0.04 * Math.sin(frame * 0.2), B = G.B;
    ctx.fillStyle = `rgba(77,163,255,${a})`; ctx.fillRect(X(B[0]), Y(B[1]), (B[2] - B[0]) * U, (B[3] - B[1]) * U);
  }
  const idx = G.step;
  for (const g of G.ghosts) if (!g.dead && (g.loop || gIdx(g, idx) < g.n)) drawGhost(g, idx);
  if (G.cfg && G.cfg.dark) drawDark();
  if (G.gem) drawGem(); if (G.orb) drawOrb();
  drawPlayer();
  drawFx();
  if (G.mode === 'dying' && G.killer) {
    const g = G.killer, i = Math.min(gIdx(g, idx), g.n - 1), x = X(g.path[2 * i]), y = Y(g.path[2 * i + 1]);
    const r = R * U * (2.2 + Math.sin(G.deathT * 12) * 0.3);
    ctx.strokeStyle = g.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    const lbl = g.pre ? '' : g.mem ? L().memLbl : g.ch ? G.chal.name : lang === 'tr' ? `${g.born}. tur` : `round ${g.born}`;
    ctx.fillStyle = g.col; ctx.font = `700 13px ${cssVar('--f-num')}`; ctx.textAlign = 'center';
    if (lbl) ctx.fillText(lbl, x, y - r - 8);
  }
  if (G.flash > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.35})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}
const cssVarCache = {};
function cssVar(n) { return cssVarCache[n] || (cssVarCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim() || 'monospace'); }

// shrunken box and walls
function drawBox() {
  const B = G.B;
  if (G.cfg && G.cfg.box < 1) {
    const x0 = X(B[0]), y0 = Y(B[1]), x1 = X(B[2]), y1 = Y(B[3]), ax = AX, ay = AY, aw = AWu * U, ah = AHu * U;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(ax, ay, aw, y0 - ay); ctx.fillRect(ax, y1, aw, ay + ah - y1); ctx.fillRect(ax, y0, x0 - ax, y1 - y0); ctx.fillRect(x1, y0, ax + aw - x1, y1 - y0);
    ctx.strokeStyle = 'rgba(126,249,255,.5)'; ctx.lineWidth = 1.5; roundRect(ctx, x0, y0, x1 - x0, y1 - y0, 10); ctx.stroke();
  }
  for (const [a, b, c, d] of G.Wl) {
    ctx.fillStyle = 'rgba(138,143,179,.22)'; ctx.fillRect(X(a), Y(b), c * U, d * U);
    ctx.strokeStyle = 'rgba(210,214,245,.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(X(a), Y(b), c * U, d * U);

}
function drawDark() {
  const r = G.cfg.dark * U, px = X(G.px), py = Y(G.py);
  const gr = ctx.createRadialGradient(px, py, r * 0.55, px, py, r);
  gr.addColorStop(0, 'rgba(6,6,12,0)'); gr.addColorStop(1, 'rgba(6,6,12,.97)');
  ctx.fillStyle = gr; ctx.fillRect(AX - 2, AY - 2, AWu * U + 4, AHu * U + 4);
}

function drawBody(x, y, col, vx, vy, alpha, core) {
  const r = R * U, sx = X(x), sy = Y(y);
  ctx.globalAlpha = alpha * 0.9; ctx.globalCompositeOperation = 'lighter';
  const gs = r * 5.5; ctx.drawImage(glow(col), sx - gs / 2, sy - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  if (core) { ctx.fillStyle = core; ctx.beginPath(); ctx.arc(sx, sy, r * 0.55, 0, Math.PI * 2); ctx.fill(); }
  const m = Math.hypot(vx, vy);
  if (m > 1e-6) { ctx.fillStyle = '#06060c'; ctx.beginPath(); ctx.arc(sx + vx / m * r * 0.45, sy + vy / m * r * 0.45, r * 0.24, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function drawGhost(g, idx) {
  const i = gIdx(g, idx), p = g.path, x = p[2 * i], y = p[2 * i + 1];
  const fright = G.fright > 0, blink = fright && G.fright < 1 && (frame >> 3) & 1;
  const col = fright ? (blink ? '#ffffff' : '#4da3ff') : g.col;
  const born = idx < GRACE ? 0.25 + 0.55 * idx / GRACE : 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // short trail
  ctx.globalAlpha = 0.22 * born; ctx.strokeStyle = col; ctx.lineWidth = R * U * 1.1;
  ctx.beginPath(); const s0 = Math.max(0, i - 10); ctx.moveTo(X(p[2 * s0]), Y(p[2 * s0 + 1]));
  for (let j = s0 + 1; j <= i; j++) ctx.lineTo(X(p[2 * j]), Y(p[2 * j + 1])); ctx.stroke();
  // where it's going next
  const e = Math.min(g.n - 1, i + 30);

    ctx.globalAlpha = 0.28 * born; ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(X(x), Y(y)); for (let j = i + 1; j <= e; j++) ctx.lineTo(X(p[2 * j]), Y(p[2 * j + 1])); ctx.stroke(); ctx.setLineDash([]);
  }
  const vx = i > 0 ? x - p[2 * i - 2] : 0, vy = i > 0 ? y - p[2 * i - 1] : 0;

  if (idx < GRACE) {

    ctx.beginPath(); ctx.arc(X(x), Y(y), R * U * (1.4 + (1 - idx / GRACE) * 1.5), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  if (G.mode === 'dying') return;
  const r = G.rec, n = r.length / 2;
  if (n > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = YOU; ctx.lineWidth = R * U * 1.1; ctx.globalAlpha = 0.25;
    const s0 = Math.max(0, n - 12); ctx.beginPath(); ctx.moveTo(X(r[2 * s0]), Y(r[2 * s0 + 1]));
    for (let j = s0 + 1; j < n; j++) ctx.lineTo(X(r[2 * j]), Y(r[2 * j + 1])); ctx.stroke(); ctx.globalAlpha = 1;
  }

}

function drawGem() {
  const g = G.gem, x = X(g.x), y = Y(g.y), r = GEM_R * U, t = frame / 60;
  const f = clamp(G.fuse / G.fuseMax, 0, 1);

  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.9;
  const gs = r * 6 * (1 + 0.08 * Math.sin(t * 6)); ctx.drawImage(glow('#ffd166'), x - gs / 2, y - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(255,209,102,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#fff4cf'; ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(r * 0.35, 0); ctx.lineTo(0, r * 0.45); ctx.lineTo(-r * 0.35, 0); ctx.closePath(); ctx.fill();

}

function drawOrb() {

  ctx.globalCompositeOperation = 'lighter'; const gs = r * 7 * (1 + 0.15 * Math.sin(t * 5)); ctx.drawImage(glow('#b47cff'), x - gs / 2, y - gs / 2, gs, gs);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#b47cff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0d33'; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 3; k++) { const a = t * 3 + k * 2.094; ctx.fillStyle = '#e3d0ff'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 1.7, y + Math.sin(a) * r * 1.7, 2, 0, Math.PI * 2); ctx.fill(); }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx) { ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.col; ctx.fillRect(X(p.x) - p.size / 2, Y(p.y) - p.size / 2, p.size, p.size); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  for (const t of texts) { ctx.globalAlpha = 1 - t.life / t.max; ctx.fillStyle = t.col; ctx.font = `700 ${t.size}px ${cssVar('--f-num')}`; ctx.fillText(t.s, X(t.x), Y(t.y)); }
  ctx.globalAlpha = 1;
}

// the menu shows the whole idea without words: one dot, red copies following its exact path, late
function drawMenuDemo(dt) {

    const ex = mx(p.path[2 * n - 2]), ey = my(p.path[2 * n - 1]);

function drawOver(dt) {

  const dur = 3.2, f = Math.min(1, G.overT / dur), tau = (1 - Math.pow(1 - f, 2)) * maxN + 1;
  if (f < 1) { drawStory(ctx, X, Y, tau, 2, true); return; }

    const c = storyCache.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); drawStory(c, X, Y, Infinity, 2, false);
